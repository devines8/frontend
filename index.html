<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 2.0</title>
</head>
<body>
    <h2>Работа с данными</h2>

    <input type="text" id="dataInput" placeholder="Введите данные">
    <button onclick="sendData()">Отправить</button>
    <p id="result"></p>

    <hr>

    <textarea id="output" rows="8" cols="50" placeholder="Здесь появятся данные" readonly></textarea>
    <br>
    <button onclick="readData()">Получить данные</button>

    <script>
        function sendData() {
            const data = document.getElementById("dataInput").value;
            fetch("http://127.0.0.1:5000/submit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: data })
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById("result").textContent = result.message;
            })
            .catch(error => {
                document.getElementById("result").textContent = "Ошибка: " + error;
            });
        }

        function readData() {
            fetch("http://127.0.0.1:5000/read")
            .then(response => response.json())
            .then(result => {
                document.getElementById("output").value = result.content;
            })
            .catch(error => {
                document.getElementById("output").value = "Ошибка: " + error;
            });
        }
    </script>
</body>
</html>
